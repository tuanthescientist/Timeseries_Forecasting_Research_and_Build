[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-research"
version = "0.2.0"
description = "Rolling-origin evaluation, persistence baselines and conformal prediction intervals for financial return forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Trần Anh Tuân"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6.29"]
dev = ["timeseries-research[notebooks]", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
