[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-research"
version = "0.1.0"
description = "Rolling-origin forecasting evaluation and exploratory financial time-series notebooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
ts-benchmark = "tsresearch.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
