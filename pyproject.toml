[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-interval-calibration"
version = "0.3.0"
description = "Auditable BTC daily-Low forecasting and delayed-feedback interval calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tuan Tran"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.10"]
acquisition = ["yfinance>=0.2"]
attention = ["tensorflow==2.19.0", "numpy>=1.26", "scikit-learn>=1.4"]
statistics = ["scipy>=1.11"]
documents = ["python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
