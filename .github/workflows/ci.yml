name: BTC foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: pip
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: python scripts/smoke_demo.py
        # Synthetic only; no BTC downloads, archived notebook execution or neural fitting.
