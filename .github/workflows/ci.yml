name: Reproducibility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements-lock.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: ts-benchmark --csv data/demo/synthetic_prices.csv --output results/local/ci
