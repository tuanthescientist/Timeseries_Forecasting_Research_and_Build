name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
  notebooks:
    name: notebooks run end to end (synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements-lock.txt -e ".[notebooks]"
      - run: python scripts/run_notebooks.py
        env:
          TSR_FORCE_DEMO: '1'
